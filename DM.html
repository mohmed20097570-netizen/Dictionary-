<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img id="myImage" src="" />
  <script>
    var imageName = window.AppInventor.getWebViewString();
    if (imageName) {
      document.getElementById('myImage').src = "http://localhost/" + imageName;
    }
  </script>
</body>
</html>
