<h1>Online Dictionary</h1>
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        #pageImage {
            width: 100%;
            height: auto;
            max-width: 100%;
            display: block;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <img id="pageImage" src="" alt="صفحة المعجم">

    <script>
        // دالة لاستخراج رقم الصفحة من الرابط (مثال: index.html?page=15)
        const urlParams = new URLSearchParams(window.location.search);
        const page = urlParams.get('page') || '1'; // الصفحة 1 افتراضياً
        
        // تغيير مصدر الصورة لرابط GitHub المباشر
        document.getElementById('pageImage').src = page + '.jpg';
    </script>

</body>
</html>
